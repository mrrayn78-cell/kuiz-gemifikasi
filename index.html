<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kuiz Cabaran Minda</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .gradient-bg {
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #9333ea 100%);
    }
  </style>
</head>
<body class="gradient-bg min-h-screen text-slate-800 flex items-center justify-center p-4">

  <!-- Container Utama -->
  <div class="bg-white/95 backdrop-blur-md w-full max-w-xl rounded-2xl shadow-2xl p-6 sm:p-8 transition-all">

    <!-- Skrin 1: Mula / Pendaftaran Nama -->
    <div id="screen-start">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-extrabold text-blue-900 tracking-tight">🎮 Cabaran Kuiz Cerdas</h1>
        <p class="text-gray-500 text-sm mt-1">Uji pengetahuan dan kumpul markah tertinggi!</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Pemain</label>
          <input type="text" id="input-nama" placeholder="Contoh: Ali bin Ahmad"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Kelas / Pasukan</label>
          <input type="text" id="input-kelas" placeholder="Contoh: 5 Arif"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <button onclick="mulaPermainan()"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition duration-200">
          Mula Kuiz 🚀
        </button>
      </div>

      <!-- Butang Papan Pendahulu Cepat -->
      <div class="mt-4 text-center">
        <button onclick="paparPapanPendahulu()" class="text-sm text-blue-600 hover:underline font-medium">
          Lihat Papan Pendahulu Semasa
        </button>
      </div>
    </div>

    <!-- Skrin 2: Soalan Permainan -->
    <div id="screen-quiz" class="hidden">
      <div class="flex justify-between items-center mb-4 text-sm font-semibold text-gray-500 border-b pb-2">
        <span id="soalan-progress">Soalan 1 / 5</span>
        <span class="text-blue-600 font-bold">Skor: <span id="skor-semasa">0</span></span>
      </div>

      <h2 id="soalan-teks" class="text-lg sm:text-xl font-bold text-gray-800 min-h-[60px] mb-6">
        Soalan akan dipaparkan di sini...
      </h2>

      <div id="jawapan-container" class="space-y-3">
        <!-- Butang pilihan jawapan akan dijana secara automatik -->
      </div>
    </div>

    <!-- Skrin 3: Keputusan Akhir -->
    <div id="screen-result" class="hidden text-center">
      <h2 class="text-2xl font-bold text-gray-800">Tahniah! Kuiz Selesai 🎉</h2>
      <p class="text-gray-500 mt-1">Berikut adalah markah akhir anda:</p>

      <div class="my-6">
        <span id="skor-akhir" class="text-5xl font-black text-blue-600">0</span>
        <span class="text-gray-400 text-lg"> mata</span>
      </div>

      <div id="status-hantar" class="text-sm font-medium mb-4 text-gray-500">
        Menyimpan rekod ke pangkalan data...
      </div>

      <button onclick="paparPapanPendahulu()"
        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow-md transition duration-200 mb-3">
        Lihat Papan Pendahulu 🏆
      </button>
      <button onclick="lokasiMula()"
        class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 rounded-lg transition duration-200">
        Main Sekali Lagi
      </button>
    </div>

    <!-- Skrin 4: Papan Pendahulu (Leaderboard) -->
    <div id="screen-leaderboard" class="hidden">
      <h2 class="text-2xl font-bold text-center text-gray-800 mb-4">🏆 Papan Pendahulu Top 10</h2>

      <div class="overflow-x-auto max-h-72 overflow-y-auto border rounded-lg mb-6">
        <table class="w-full text-left border-collapse text-sm">
          <thead class="bg-gray-100 sticky top-0 text-gray-600 uppercase text-xs">
            <tr>
              <th class="p-3">#</th>
              <th class="p-3">Nama</th>
              <th class="p-3">Kelas</th>
              <th class="p-3 text-right">Skor</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body" class="divide-y divide-gray-200">
            <tr>
              <td colspan="4" class="p-4 text-center text-gray-400">Memuatkan data...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <button onclick="lokasiMula()"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg shadow-md transition duration-200">
        Kembali ke Utama
      </button>
    </div>

  </div>

  <script>
    // --- 1. KONFIGURASI SUPABASE ---
    const supabaseUrl = ''https://owaqmiaciusjbnkxlckc.supabase.co/rest/v1/';
    const supabaseKey = 'sb_publishable_p2e0sXh44MrOdVsIzI3tuQ_Y8IOoILU';
    
    // Inisialisasi Supabase Client (hanya jika nilai telah diisi)
    const isConfigured = supabaseUrl !== 'MASUKKAN_SUPABASE_URL_ANDA' && supabaseKey !== 'MASUKKAN_ANON_PUBLIC_KEY_ANDA';
    const supabase = isConfigured ? window.supabase.createClient(supabaseUrl, supabaseKey) : null;

    // --- 2. DATA SOALAN (Boleh ditambah/diubah suai) ---
    const bankSoalan = [
      {
        soalan: "Planet manakah yang paling dekat dengan Matahari?",
        pilihan: ["Zuhrah", "Utarid", "Marikh", "Bumi"],
        jawapan: 1
      },
      {
        soalan: "Apakah unit ukuran asas bagi arus elektrik?",
        pilihan: ["Volt", "Watt", "Ampere", "Ohm"],
        jawapan: 2
      },
      {
        soalan: "Berapakah bilangan hari dalam setahun lompat?",
        pilihan: ["364 hari", "365 hari", "366 hari", "367 hari"],
        jawapan: 2
      },
      {
        soalan: "Gas apakah yang dibebaskan oleh tumbuhan semasa fotosintesis?",
        pilihan: ["Oksigen", "Karbon dioksida", "Nitrogen", "Hidrogen"],
        jawapan: 0
      },
      {
        soalan: "Apakah organ manusia yang bertanggungjawab mengepam darah?",
        pilihan: ["Paru-paru", "Hati", "Jantung", "Buah pinggang"],
        jawapan: 2
      }
    ];

    // Status Kuiz
    let pemain = { nama: '', kelas: '' };
    let indeksSoalan = 0;
    let jumlahSkor = 0;

    // Rujukan Elemen
    const screenStart = document.getElementById('screen-start');
    const screenQuiz = document.getElementById('screen-quiz');
    const screenResult = document.getElementById('screen-result');
    const screenLeaderboard = document.getElementById('screen-leaderboard');

    function paparkanSkrin(skrin) {
      [screenStart, screenQuiz, screenResult, screenLeaderboard].forEach(s => s.classList.add('hidden'));
      skrin.classList.remove('hidden');
    }

    function lokasiMula() {
      indeksSoalan = 0;
      jumlahSkor = 0;
      document.getElementById('input-nama').value = '';
      document.getElementById('input-kelas').value = '';
      paparkanSkrin(screenStart);
    }

    function mulaPermainan() {
      const nama = document.getElementById('input-nama').value.trim();
      const kelas = document.getElementById('input-kelas').value.trim();

      if (!nama || !kelas) {
        alert('Sila masukkan nama dan kelas anda.');
        return;
      }

      pemain = { nama, kelas };
      indeksSoalan = 0;
      jumlahSkor = 0;
      document.getElementById('skor-semasa').innerText = jumlahSkor;

      paparkanSkrin(screenQuiz);
      muatSoalan();
    }

    function muatSoalan() {
      const soalanObj = bankSoalan[indeksSoalan];
      document.getElementById('soalan-progress').innerText = `Soalan ${indeksSoalan + 1} / ${bankSoalan.length}`;
      document.getElementById('soalan-teks').innerText = soalanObj.soalan;

      const kontena = document.getElementById('jawapan-container');
      kontena.innerHTML = '';

      soalanObj.pilihan.forEach((pilihan, idx) => {
        const btn = document.createElement('button');
        btn.innerText = pilihan;
        btn.className = "w-full text-left p-3.5 border-2 border-gray-200 rounded-xl hover:border-blue-500 hover:bg-blue-50/50 transition font-medium text-gray-700";
        btn.onclick = () => semakJawapan(idx);
        kontena.appendChild(btn);
      });
    }

    function semakJawapan(pilihanDipilih) {
      const soalanObj = bankSoalan[indeksSoalan];
      if (pilihanDipilih === soalanObj.jawapan) {
        jumlahSkor += 20; // 20 mata bagi setiap soalan betul
        document.getElementById('skor-semasa').innerText = jumlahSkor;
      }

      indeksSoalan++;
      if (indeksSoalan < bankSoalan.length) {
        muatSoalan();
      } else {
        tamatPermainan();
      }
    }

    async function tamatPermainan() {
      paparkanSkrin(screenResult);
      document.getElementById('skor-akhir').innerText = jumlahSkor;

      const statusEl = document.getElementById('status-hantar');

      if (!isConfigured) {
        statusEl.innerText = 'Nota: Kunci Supabase belum diset. Rekod tidak dihantar ke database.';
        return;
      }

      statusEl.innerText = 'Menyimpan rekod ke pangkalan data...';
      try {
        const { error } = await supabase
          .from('leaderboard')
          .insert([{ player_name: pemain.nama, score: jumlahSkor, school_class: pemain.kelas }]);

        if (error) throw error;
        statusEl.innerText = '✅ Skor berjaya disimpan ke papan pendahulu!';
      } catch (err) {
        console.error(err);
        statusEl.innerText = '⚠️ Gagal menyimpan skor ke database.';
      }
    }

    async function paparPapanPendahulu() {
      paparkanSkrin(screenLeaderboard);
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-400">Memuatkan data...</td></tr>';

      if (!isConfigured) {
        tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Supabase URL & Key belum dimasukkan dalam kod.</td></tr>';
        return;
      }

      try {
        const { data, error } = await supabase
          .from('leaderboard')
          .select('*')
          .order('score', { ascending: false })
          .limit(10);

        if (error) throw error;

        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Belum ada rekod.</td></tr>';
          return;
        }

        tbody.innerHTML = data.map((baris, i) => `
          <tr class="${i === 0 ? 'bg-amber-50 font-bold' : ''}">
            <td class="p-3">${i + 1}</td>
            <td class="p-3">${escapeHtml(baris.player_name)}</td>
            <td class="p-3 text-gray-500">${escapeHtml(baris.school_class || '-')}</td>
            <td class="p-3 text-right font-semibold text-blue-600">${baris.score}</td>
          </tr>
        `).join('');
      } catch (err) {
        console.error(err);
        tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-red-500">Ralat semasa memuatkan data.</td></tr>';
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
